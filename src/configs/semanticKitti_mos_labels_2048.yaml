# Dedicated local configuration for generating full-resolution SemanticKITTI
# MOS labels. This file is not used by a training entry point.
dataset_path: /home/devuser/workspace/data/datasets/SemanticKitti/dataset/sequences

model_params:
  grid_height: 64
  grid_width: 2048
  FOV_UP: 3.0
  FOV_DOWN: -25.0
  min_range: 0.1
  max_range: 80.0

mos_data_params:
  mos_label_folder: mos_labels_2048

mos_label_params:
  enabled: true
  mode: precompute
  folder_name: mos_labels_2048
  ignore_index: -1
  static_index: 0
  moving_index: 1
  overwrite: false
  min_range: 0.1
  max_range: 80.0
  label_mapping: semantickitti_mos
