# Offline generation of ego-motion-compensated residual images at the native
# SemanticKITTI range-view resolution.  This config is not a training config.
dataset_path: /home/devuser/workspace/data/datasets/SemanticKitti/dataset/sequences

residual_params:
  enabled: true
  mode: precompute
  offsets: [1]
  # Store |range(t) - range(t-1, warped)| / range(t), rather than metres.
  normalize: true
  min_range: 2.0
  max_range: 50.0
  invalid_value: 0.0
  # Kept separate from existing residual_images_1 (for example, 512-wide)
  # so that existing experiments remain reproducible.
  folder_template: residual_images_1_Full_Res
  overwrite: false
  visualize_debug: false

model_params:
  grid_height: 64
  grid_width: 2048
  FOV_UP: 3.0
  FOV_DOWN: -25.0
