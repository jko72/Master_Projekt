dataset_path: "/home/devuser/workspace/data/datasets/SemanticKitti/dataset/sequences"

model_params:
  name: "salsanext_mae_rangexyz"
  grid_height: 64
  grid_width: 512
  grid_channels: 4
  org_grid_height: 64
  org_grid_width: 2048
  FOV_UP: 3.0
  FOV_DOWN: -25.0
  min_range: 0.1
  max_range: 80.0
  preserve_ray_position: false
  dropout_prob: 0.2

pretrain_params:
  task: "mae_rangexyz"
  mask:
    type: "patch"
    patch_h: 4
    patch_w: 16
    mask_ratio: 0.5
    mask_only_valid: true
  loss:
    name: "smooth_l1"
    xyz_weight: 0.5
    range_weight: 1.0
    loss_on_mask_only: true
    min_range: 0.1
  auxiliary_tasks:
    surface_normals:
      enabled: false
      weight: 0.1
      loss: "cosine"

data_params:
  split_type: "predefined"
  train_sequences: ["00", "01", "02", "03", "04", "05", "06", "09", "10"]
  val_sequences: ["08"]
  test_sequences: ["07"]

test_params:
  batch_size: 1
  num_workers: 2
  max_samples: 0
  max_visualizations: 25
  seed: 42
  mask_epoch: 0
  output_dir: null
  show: false
  show_pause_seconds: 0.5

train_params:
  batch_size: 16
  num_workers: 4
  num_total_epochs: 60
  learning_rate: 5.0e-4
  learning_rate_min: 5.0e-6
  num_warmup_epochs: 2
  weight_decay: 1.0e-4
  clip_grad_norm: 5.0
  optimizer: "adamw"
  scheduler: "warmup_cosine"
  seed: 42
  deterministic: false
  with_save: true
  logs_save_dir: "/home/devuser/workspace/LidarGaussianVideoView/pretrain_logs"
  use_tensorboard: true
  plot_examples: true
  plot_batch_step: 5
  save_visualizations: true
  visualization_interval_epochs: 5
